info:
  name: Crear Estudiante
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8088/api/v1/students
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "Ana",
        "lastName": "Ruiz",
        "email": "ana@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
